<script>
  // Исправляем пути к ресурсам для GitHub Pages
  (function() {
    function fixPath(url) {
      if (typeof url !== 'string') return url;
      // Исправляем полные URL
      url = url.replace(/^https:\/\/ivanplat1\.github\.io\/assets\/node_modules\//, 'https://ivanplat1.github.io/DrinkNote/_expo/static/');
      url = url.replace(/^https:\/\/ivanplat1\.github\.io\/assets\//, 'https://ivanplat1.github.io/DrinkNote/_expo/static/');
      // Исправляем относительные пути
      url = url.replace(/^\/assets\/node_modules\//, '/DrinkNote/_expo/static/');
      url = url.replace(/^\/assets\//, '/DrinkNote/_expo/static/');
      return url;
    }
    
    // Перехватываем fetch
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
      if (typeof args[0] === 'string') {
        args[0] = fixPath(args[0]);
      } else if (args[0] && args[0].url) {
        args[0] = { ...args[0], url: fixPath(args[0].url) };
      }
      return originalFetch.apply(this, args);
    };
    
    // Перехватываем создание элементов link для шрифтов
    const originalCreateElement = document.createElement;
    document.createElement = function(tagName, options) {
      const element = originalCreateElement.call(this, tagName, options);
      if (tagName === 'link') {
        const originalSetAttribute = element.setAttribute;
        element.setAttribute = function(name, value) {
          if (name === 'href' && typeof value === 'string') {
            value = fixPath(value);
          }
          return originalSetAttribute.call(this, name, value);
        };
        // Также перехватываем прямое присваивание href
        Object.defineProperty(element, 'href', {
          set: function(value) {
            this.setAttribute('href', fixPath(value));
          },
          get: function() {
            return this.getAttribute('href');
          }
        });
      }
      return element;
    };
  })();
  
  // Регистрация Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/DrinkNote/sw.js')
        .then((registration) => {
          console.log('SW registered: ', registration);
        })
        .catch((registrationError) => {
          console.log('SW registration failed: ', registrationError);
        });
    });
  }
</script>
