<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>DrinkNote</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="/DrinkNote/favicon.ico" />  <link rel="apple-touch-icon" sizes="180x180" href="/DrinkNote/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DrinkNote" />
  <link rel="manifest" href="/DrinkNote/manifest.json" />

    <style>
      /* Safe area insets для iOS */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-right: env(safe-area-inset-right);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --safe-area-inset-left: env(safe-area-inset-left);
      }
      
      /* Применяем safe area к body */
      /* Для black-translucent статус-бара контент должен быть под ним без дополнительного padding */
      /* Фон должен быть черным, чтобы статус-бар выглядел правильно */
      /* НЕ добавляем padding-bottom к body - применяем только к таб-бару */
      body {
        background-color: #000000;
        margin: 0;
        padding: 0;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        position: fixed;
        width: 100%;
        /* Отключаем overscroll */
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
      }
      
      /* В standalone режиме фиксируем body на 100vh */
      @media (display-mode: standalone) {
        body {
          height: 100vh;
          max-height: 100vh;
          overflow: hidden;
          position: fixed;
          width: 100%;
          /* Отключаем overscroll */
          overscroll-behavior: none;
          overscroll-behavior-y: none;
        }
      }
      
      /* Убеждаемся, что статус-бар имеет правильный цвет фона */
      html {
        background-color: #000000;
        margin: 0;
        padding: 0;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        /* Отключаем overscroll */
        overscroll-behavior: none;
        overscroll-behavior-y: none;
      }
      
      /* Для black-translucent НЕ добавляем padding-top к root - контент должен быть под статус-баром */
      #root {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        position: relative;
        overflow: hidden;
      }
      
      /* Применяем safe area к таб-бару React Navigation только в standalone режиме */
      @media (display-mode: standalone) {
        /* Убеждаемся, что основной контейнер контента занимает оставшееся пространство */
        #root > div {
          flex: 1;
          display: flex;
          flex-direction: column;
          position: relative;
          overflow: hidden;
          min-height: 0;
        }
        
        nav[role="tablist"],
        [data-testid="tab-bar"],
        .tab-bar,
        div[style*="position: fixed"][style*="bottom: 0"],
        div[style*="bottom: 0px"],
        div[style*="bottom:0px"] {
          position: fixed !important;
          bottom: 0 !important;
          left: 0 !important;
          right: 0 !important;
          padding-bottom: env(safe-area-inset-bottom) !important;
          margin-bottom: 0 !important;
          /* Увеличиваем минимальную высоту панели вкладок, чтобы она была достаточно высокой */
          /* Увеличиваем базовую высоту с 49px до 70px для лучшего размещения текста */
          min-height: calc(70px + env(safe-area-inset-bottom)) !important;
          /* Убеждаемся, что панель вкладок поверх всего контента */
          z-index: 1000 !important;
        }
        
        /* Скрываем кнопки удаления при загрузке PWA */
        @media (display-mode: standalone) {
          /* Скрываем все контейнеры с position: absolute/fixed, которые могут быть кнопками удаления */
          div[style*="position: absolute"][style*="right: 0"],
          div[style*="position: fixed"][style*="right: 0"] {
            width: 0 !important;
            overflow: hidden !important;
            max-width: 0 !important;
          }
          
          /* Скрываем элементы с иконками удаления (красный цвет) */
          div[style*="rgb(239, 68, 68)"],
          div[style*="color: rgb(239, 68, 68)"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
          }
        }
        
        /* Увеличиваем высоту элементов внутри панели вкладок */
        nav[role="tablist"] > *,
        [data-testid="tab-bar"] > *,
        .tab-bar > * {
          min-height: calc(70px + env(safe-area-inset-bottom)) !important;
          z-index: 1001 !important;
        }
        
        /* Скрываем кнопки удаления при загрузке PWA */
        /* Скрываем все контейнеры с position: absolute/fixed справа, которые могут быть кнопками удаления */
        div[style*="position: absolute"][style*="right: 0"],
        div[style*="position: fixed"][style*="right: 0"] {
          width: 0 !important;
          overflow: hidden !important;
          max-width: 0 !important;
        }
        
        /* Скрываем элементы с иконками удаления (красный цвет) */
        div[style*="rgb(239, 68, 68)"],
        div[style*="color: rgb(239, 68, 68)"],
        div[style*="239, 68, 68"] {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          width: 0 !important;
          height: 0 !important;
          overflow: hidden !important;
        }
        
        /* Увеличиваем высоту кнопок вкладок и их контейнеров */
        nav[role="tablist"] button,
        nav[role="tablist"] a,
        [data-testid="tab-bar"] button,
        [data-testid="tab-bar"] a,
        .tab-bar button,
        .tab-bar a {
          min-height: 70px !important;
          padding-top: 8px !important;
          padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: center !important;
          align-items: center !important;
          z-index: 1002 !important;
        }

        /* Уменьшаем размер шрифта подписей вкладок */
        nav[role="tablist"] div[dir="auto"],
        [data-testid="tab-bar"] div[dir="auto"],
        .tab-bar div[dir="auto"],
        nav[role="tablist"] div[class*="css-146c3p1"],
        [data-testid="tab-bar"] div[class*="css-146c3p1"],
        .tab-bar div[class*="css-146c3p1"],
        nav[role="tablist"] div[class*="r-dnmrzs"],
        [data-testid="tab-bar"] div[class*="r-dnmrzs"],
        .tab-bar div[class*="r-dnmrzs"] {
          font-size: 10px !important;
          line-height: 1.1 !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        
      }
      
      /* Альтернативный подход: применяем через JavaScript после загрузки */
      /* Это будет добавлено в runtime скрипт ниже */
    </style>

<script>
  // Исправляем пути к ресурсам для GitHub Pages (выполняется немедленно)
  (function() {
    function fixPath(url) {
      if (typeof url !== 'string') return url;
      
      // Сначала убираем все дублирования /DrinkNote/DrinkNote/...
      url = url.replace(/\/DrinkNote\/DrinkNote\/+/g, '/DrinkNote/');
      
      // Если путь уже содержит /DrinkNote/ перед /assets/, не трогаем его
      if (url.match(/\/DrinkNote\/assets\//) || url.match(/\/DrinkNote\/_expo\//)) {
        return url;
      }
      
      // Исправляем полные URL (разные варианты)
      // Файлы находятся в /assets/node_modules/, а не в _expo/static/
      if (url.startsWith('https://ivanplat1.github.io/assets/')) {
        url = url.replace('https://ivanplat1.github.io/assets/', 'https://ivanplat1.github.io/DrinkNote/assets/');
        return url;
      }
      
      // Исправляем относительные пути (только если они начинаются с /assets/ и не содержат /DrinkNote/)
      if (url.startsWith('/assets/') && !url.startsWith('/DrinkNote/')) {
        url = '/DrinkNote' + url;
        return url;
      }
      
      return url;
    }
    
    // Перехватываем fetch ДО загрузки основного скрипта
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
      if (typeof args[0] === 'string') {
        args[0] = fixPath(args[0]);
      } else if (args[0] && args[0].url) {
        args[0] = { ...args[0], url: fixPath(args[0].url) };
      }
      return originalFetch.apply(this, args);
    };
    
    // Перехватываем создание элементов link для шрифтов
    const originalCreateElement = document.createElement;
    document.createElement = function(tagName, options) {
      const element = originalCreateElement.call(this, tagName, options);
      if (tagName === 'link') {
        const originalSetAttribute = element.setAttribute;
        element.setAttribute = function(name, value) {
          if (name === 'href' && typeof value === 'string') {
            value = fixPath(value);
          }
          return originalSetAttribute.call(this, name, value);
        };
        // Также перехватываем прямое присваивание href
        try {
          Object.defineProperty(element, 'href', {
            set: function(value) {
              this.setAttribute('href', fixPath(value));
            },
            get: function() {
              return this.getAttribute('href');
            },
            configurable: true
          });
        } catch (e) {
          // Игнорируем ошибки определения свойства
        }
      }
      return element;
    };
    
    // Перехватываем загрузку CSS файлов и исправляем пути в них
    const originalAppendChild = Node.prototype.appendChild;
    Node.prototype.appendChild = function(child) {
      if (child && child.tagName === 'LINK' && child.rel === 'stylesheet') {
        const originalHref = child.href;
        // Исправляем href ДО добавления элемента
        if (originalHref) {
          child.href = fixPath(originalHref);
        }
        const originalSetAttribute = child.setAttribute;
        child.setAttribute = function(name, value) {
          if (name === 'href') {
            value = fixPath(value);
          }
          return originalSetAttribute.call(this, name, value);
        };
        // Также перехватываем onload для исправления путей в @font-face после загрузки
        const originalOnLoad = child.onload;
        child.onload = function() {
          // После загрузки CSS исправляем пути в @font-face
          try {
            const sheets = document.styleSheets;
            for (let i = 0; i < sheets.length; i++) {
              try {
                const rules = sheets[i].cssRules || sheets[i].rules;
                for (let j = 0; j < rules.length; j++) {
                  if (rules[j].type === CSSRule.FONT_FACE_RULE) {
                    const src = rules[j].style.src;
                    if (src) {
                      rules[j].style.src = src.replace(/url\(["']?https:\/\/ivanplat1\.github\.io\/assets\//g, 'url("https://ivanplat1.github.io/DrinkNote/assets/');
                      rules[j].style.src = rules[j].style.src.replace(/url\(["']?\/assets\//g, 'url("/DrinkNote/assets/');
                    }
                  }
                }
              } catch (e) {
                // Игнорируем ошибки доступа к правилам (CORS)
              }
            }
          } catch (e) {
            // Игнорируем ошибки
          }
          if (originalOnLoad) originalOnLoad.call(this);
        };
      }
      return originalAppendChild.call(this, child);
    };
    
    // Перехватываем добавление стилей для исправления путей в CSS
    const originalInsertRule = CSSStyleSheet.prototype.insertRule;
    CSSStyleSheet.prototype.insertRule = function(rule, index) {
      if (typeof rule === 'string') {
        rule = rule.replace(/url\(["']?https:\/\/ivanplat1\.github\.io\/assets\//g, 'url("https://ivanplat1.github.io/DrinkNote/assets/');
        rule = rule.replace(/url\(["']?\/assets\//g, 'url("/DrinkNote/assets/');
      }
      return originalInsertRule.call(this, rule, index);
    };
    
      // Функция для уменьшения размера шрифта подписей вкладок (не скрываем их)
      function fixTabBarLabels() {
        // Ищем все возможные элементы с подписями
        const selectors = [
          'nav[role="tablist"] div[dir="auto"]',
          '[data-testid="tab-bar"] div[dir="auto"]',
          '.tab-bar div[dir="auto"]',
          'nav[role="tablist"] div[class*="css-146c3p1"]',
          '[data-testid="tab-bar"] div[class*="css-146c3p1"]',
          '.tab-bar div[class*="css-146c3p1"]',
          'nav[role="tablist"] div[class*="r-dnmrzs"]',
          '[data-testid="tab-bar"] div[class*="r-dnmrzs"]',
          '.tab-bar div[class*="r-dnmrzs"]',
          'a[role="tab"] div[dir="auto"]',
          'button[role="tab"] div[dir="auto"]',
        ];
        
        selectors.forEach(selector => {
          try {
            const textDivs = document.querySelectorAll(selector);
            textDivs.forEach(textDiv => {
              // Проверяем, что это не иконка
              const hasSvg = textDiv.querySelector('svg');
              const className = textDiv.className && typeof textDiv.className === 'string' ? textDiv.className : '';
              const hasIconClass = className.includes('ionicons') || className.includes('icon') || className.includes('r-lrvibr');
              const isIcon = hasSvg || hasIconClass;
              
              // Уменьшаем размер шрифта для подписей, но НЕ скрываем их
              if (!isIcon && textDiv.textContent && textDiv.textContent.trim()) {
                // Убеждаемся, что элемент видим
                textDiv.style.setProperty('display', 'block', 'important');
                textDiv.style.setProperty('visibility', 'visible', 'important');
                textDiv.style.setProperty('opacity', '1', 'important');
                textDiv.style.setProperty('height', 'auto', 'important');
                textDiv.style.setProperty('width', 'auto', 'important');
                textDiv.style.setProperty('overflow', 'visible', 'important');
                // Устанавливаем размер шрифта
                textDiv.style.setProperty('font-size', '10px', 'important');
                textDiv.style.setProperty('line-height', '1.1', 'important');
                textDiv.style.setProperty('padding', '0', 'important');
                textDiv.style.setProperty('margin', '0', 'important');
              }
            });
          } catch (e) {
            // Игнорируем ошибки селекторов
          }
        });
      }
    
    // Функция для исправления кликов на таб-баре
    function fixTabBarClicks() {
      // Ищем все кликабельные элементы таб-бара
      const tabBarSelectors = [
        'nav[role="tablist"]',
        '[data-testid="tab-bar"]',
        '.tab-bar',
      ];
      
      tabBarSelectors.forEach(selector => {
        try {
          const tabBars = document.querySelectorAll(selector);
          tabBars.forEach(tabBar => {
            // Убеждаемся, что таб-бар кликабелен и не перекрыт
            tabBar.style.setProperty('pointer-events', 'auto', 'important');
            tabBar.style.setProperty('z-index', '1000', 'important');
            
            // Ищем все кликабельные элементы внутри таб-бара (ссылки и кнопки)
            const clickableElements = tabBar.querySelectorAll('a[role="tab"], button[role="tab"], a[href], button');
            clickableElements.forEach((element, index) => {
              // Убеждаемся, что элемент кликабелен
              element.style.setProperty('pointer-events', 'auto', 'important');
              element.style.setProperty('cursor', 'pointer', 'important');
              element.style.setProperty('z-index', String(1001 + index), 'important');
              
              // Убеждаемся, что элемент видим и не скрыт
              const computedStyle = window.getComputedStyle(element);
              if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') {
                element.style.setProperty('display', 'flex', 'important');
                element.style.setProperty('visibility', 'visible', 'important');
              }
              
              // Убеждаемся, что элемент не перекрыт другими элементами
              if (computedStyle.pointerEvents === 'none') {
                element.style.setProperty('pointer-events', 'auto', 'important');
              }
              
              // Убеждаемся, что элемент имеет правильную позицию
              if (computedStyle.position === 'static') {
                element.style.setProperty('position', 'relative', 'important');
              }
            });
            
            // Ищем все дочерние элементы и убеждаемся, что они не блокируют клики
            const allChildren = tabBar.querySelectorAll('*');
            allChildren.forEach(child => {
              const computedStyle = window.getComputedStyle(child);
              
              // Пропускаем кликабельные элементы (они уже обработаны выше)
              if (child.tagName === 'A' || child.tagName === 'BUTTON' || child.getAttribute('role') === 'tab') {
                return;
              }
              
              // Если элемент имеет pointer-events: none, но это не иконка или текст, исправляем
              if (computedStyle.pointerEvents === 'none') {
                const isIcon = child.querySelector('svg') || 
                              (child.className && typeof child.className === 'string' && 
                               (child.className.includes('ionicons') || child.className.includes('icon')));
                const isText = child.textContent && child.textContent.trim() && 
                              !child.querySelector('svg') && 
                              !child.querySelector('button') && 
                              !child.querySelector('a');
                
                // Для текста и иконок оставляем pointer-events: none, чтобы клики проходили к родителю
                if (!isIcon && !isText) {
                  child.style.setProperty('pointer-events', 'auto', 'important');
                }
              }
            });
          });
        } catch (e) {
          console.error('Error fixing tab bar clicks:', e);
        }
      });
    }
    
    // Функция для скрытия кнопок удаления при загрузке PWA
    function hideDeleteButtons() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          (window.navigator && window.navigator.standalone) || 
                          document.referrer.includes('android-app://');
      
      if (!isStandalone) return;
      
      // Стратегия 1: Ищем все элементы с иконкой удаления (Material Icons delete-sweep)
      // Иконка имеет цвет rgb(239, 68, 68) и размер 28px
      const deleteButtons = document.querySelectorAll('div[style*="rgb(239, 68, 68)"], div[style*="color: rgb(239, 68, 68)"], div[style*="239, 68, 68"]');
      deleteButtons.forEach(btn => {
        // Проверяем, что это действительно иконка удаления (имеет font-family: material)
        const style = window.getComputedStyle(btn);
        if (style.fontFamily && style.fontFamily.includes('material')) {
          // Скрываем сам элемент
          btn.style.setProperty('display', 'none', 'important');
          btn.style.setProperty('visibility', 'hidden', 'important');
          btn.style.setProperty('opacity', '0', 'important');
          btn.style.setProperty('width', '0', 'important');
          btn.style.setProperty('height', '0', 'important');
          btn.style.setProperty('overflow', 'hidden', 'important');
          
          // Ищем родительский контейнер кнопки удаления
          let container = btn.parentElement;
          let depth = 0;
          while (container && container !== document.body && depth < 5) {
            const containerStyle = window.getComputedStyle(container);
            // Проверяем, является ли это контейнером кнопки удаления
            if (containerStyle.position === 'absolute' || containerStyle.position === 'fixed') {
              // Скрываем контейнер
              container.style.setProperty('width', '0', 'important');
              container.style.setProperty('max-width', '0', 'important');
              container.style.setProperty('overflow', 'hidden', 'important');
              container.style.setProperty('display', 'none', 'important');
              container.style.setProperty('visibility', 'hidden', 'important');
              container.style.setProperty('opacity', '0', 'important');
            }
            container = container.parentElement;
            depth++;
          }
        }
      });
      
      // Стратегия 2: Ищем элементы с классом deleteButtonContainer или похожими
      const deleteContainers = document.querySelectorAll('[class*="delete"], [class*="Delete"]');
      deleteContainers.forEach(container => {
        const style = window.getComputedStyle(container);
        if (style.position === 'absolute' || style.position === 'fixed') {
          container.style.setProperty('width', '0', 'important');
          container.style.setProperty('max-width', '0', 'important');
          container.style.setProperty('overflow', 'hidden', 'important');
          container.style.setProperty('display', 'none', 'important');
          container.style.setProperty('visibility', 'hidden', 'important');
          container.style.setProperty('opacity', '0', 'important');
        }
      });
      
      // Стратегия 3: Ищем контейнеры с position: absolute/fixed справа от элементов списка
      // которые могут быть кнопками удаления
      const allDivs = document.querySelectorAll('div');
      allDivs.forEach(div => {
        const style = window.getComputedStyle(div);
        const inlineStyle = div.getAttribute('style') || '';
        
        // Проверяем, является ли это контейнером кнопки удаления
        if ((style.position === 'absolute' || style.position === 'fixed') && 
            (style.right === '0px' || style.right === '0' || inlineStyle.includes('right: 0'))) {
          // Проверяем, есть ли внутри красные элементы (иконки удаления)
          const hasRedIcon = div.querySelector('div[style*="239, 68, 68"], div[style*="rgb(239, 68, 68)"]');
          if (hasRedIcon) {
            div.style.setProperty('width', '0', 'important');
            div.style.setProperty('max-width', '0', 'important');
            div.style.setProperty('overflow', 'hidden', 'important');
            div.style.setProperty('display', 'none', 'important');
            div.style.setProperty('visibility', 'hidden', 'important');
            div.style.setProperty('opacity', '0', 'important');
          }
        }
      });
      
      // Стратегия 4: Ищем элементы с transform: translateX (отрицательное значение)
      // которые могут быть карточками в состоянии свайпа
      allDivs.forEach(div => {
        const style = window.getComputedStyle(div);
        const transform = style.transform;
        if (transform && transform.includes('translateX') && transform.includes('-')) {
          // Это может быть карточка в состоянии свайпа
          // Ищем рядом контейнер кнопки удаления
          const parent = div.parentElement;
          if (parent) {
            const siblings = Array.from(parent.children);
