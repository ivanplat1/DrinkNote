name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Export and embed JavaScript bundle
        run: |
          npx expo export --platform android --output-dir ./dist
          mkdir -p android/app/src/main/assets
          cp dist/_expo/static/js/android/* android/app/src/main/assets/ 2>/dev/null || true
          # Copy index.android.bundle if exists
          if [ -f dist/index.android.bundle ]; then
            cp dist/index.android.bundle android/app/src/main/assets/
          fi
          # Copy all JS files
          find dist -name "*.js" -exec cp {} android/app/src/main/assets/ \;

      - name: Build APK (release, no signing)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drinknote-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
