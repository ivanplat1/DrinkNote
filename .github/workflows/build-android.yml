name: Build Android APK

on:
  push:
    branches: [main, master, 'feature/**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify icon assets exist
        run: |
          ls -la assets/icon.png assets/adaptive-icon.png

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore app icon (prebuild may skip it in CI)
        run: |
          RES="android/app/src/main/res"
          BACKUP=".github/android-res-icons"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26; do
            if [ -d "$BACKUP/$dir" ]; then
              rm -rf "$RES/$dir"
              cp -r "$BACKUP/$dir" "$RES/"
              echo "Restored $dir"
            fi
          done
          ls -la "$RES"/mipmap-*/

      - name: Export and embed JavaScript bundle
        run: |
          npx expo export --platform android --output-dir ./dist
          mkdir -p android/app/src/main/assets
          cp dist/_expo/static/js/android/* android/app/src/main/assets/ 2>/dev/null || true
          # Copy index.android.bundle if exists
          if [ -f dist/index.android.bundle ]; then
            cp dist/index.android.bundle android/app/src/main/assets/
          fi
          # Copy all JS files
          find dist -name "*.js" -exec cp {} android/app/src/main/assets/ \;

      - name: Configure unsigned release build
        run: |
          # Ensure release build doesn't require signing
          if [ -f android/app/build.gradle ]; then
            # Check if signingConfigs block exists, if not we'll let gradle use default
            echo "Checking build.gradle configuration..."
          fi

      - name: Build APK (release, no signing)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and list APK files
        run: |
          echo "Searching for APK files..."
          find android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -20 || echo "No APK files found"
          echo "---"
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory not found"
          echo "---"
          ls -la android/app/build/outputs/apk/ 2>/dev/null || echo "APK outputs directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drinknote-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
